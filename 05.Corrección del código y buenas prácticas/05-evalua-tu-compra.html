<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Evaluá tu compra</title>

  <style>
    :root {
      --bg-base: #f5f5f5;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text: #2f2f2f;
      --muted: #666;
      --border: #e0e0e0;
      --primary: #4f46e5;
      --error: #dc2626;
      --shadow: rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-base);
      transition: background 0.5s ease;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: min(100%, 500px);
      padding: 32px 28px;
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
    }

    h1 {
      text-align: center;
      margin: 0 0 12px;
      color: var(--text);
      font-size: clamp(2rem, 4vw, 2.4rem);
    }

    .slider-container {
      margin-bottom: 26px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .slider-wrap {
      position: relative;
      padding: 10px 0 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .emoji-display {
      text-align: center;
      font-size: 2.6rem;
      min-height: 48px;
      margin-top: 8px;
      line-height: 1;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 14px 15px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
      color: var(--text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
    }

    textarea.error {
      border-color: var(--error);
      background: #fff5f5;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .error-message {
      display: none;
      color: var(--error);
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .error-message.show {
      display: block;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.32);
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .form-container.hide {
      display: none;
    }

    .thank-you {
      display: none;
      text-align: center;
      padding: 8px 0;
      animation: fadeIn 0.4s ease;
    }

    .thank-you.show {
      display: block;
    }

    .thank-you h2 {
      margin: 12px 0 16px;
      color: #1f7a4d;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
    }

    .thank-you .emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
    }

    .thank-you .comment {
      margin-top: 14px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 12px;
      color: #374151;
      font-style: italic;
      text-align: left;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container" id="formContainer">
      <h1>Evaluá tu compra</h1>

      <div class="slider-container">
        <div class="slider-labels">
          <span>Malo</span>
          <span>Regular</span>
          <span>Bueno</span>
        </div>

        <div class="slider-wrap">
          <input type="range" id="ratingSlider" min="0" max="2" step="1" value="1" />
        </div>

        <div class="emoji-display" id="emojiDisplay">😐</div>
      </div>

      <textarea id="comment" placeholder="Dejanos tu opinión (opcional)" aria-label="Comentario"></textarea>

      <div class="error-message" id="errorMessage">
        ⚠️ Tu comentario contiene palabras no permitidas.
      </div>

      <button id="sendBtn" disabled>Enviar</button>
    </div>

    <div class="thank-you" id="thankYou" aria-live="polite">
      <span class="emoji">✨</span>
      <h2>¡Gracias por la evaluación!</h2>
      <div id="commentOutput"></div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('ratingSlider');
    const emojiDisplay = document.getElementById('emojiDisplay');
    const sendBtn = document.getElementById('sendBtn');
    const textarea = document.getElementById('comment');
    const formContainer = document.getElementById('formContainer');
    const thankYou = document.getElementById('thankYou');
    const commentOutput = document.getElementById('commentOutput');
    const errorMessage = document.getElementById('errorMessage');
    const body = document.body;

    const prohibitedWords = ['carne', 'huevo', 'leche'];

    const feedbackConfig = {
      0: { emoji: '😞', color: '#ffcdd2' },
      1: { emoji: '😐', color: '#fff9c4' },
      2: { emoji: '😊', color: '#c8e6c9' }
    };

    let hasInteractedWithSlider = false;

    function updateBackground(value) {
      const config = feedbackConfig[value] || feedbackConfig[1];
      emojiDisplay.textContent = config.emoji;
      body.style.background = config.color;
    }

    function containsProhibitedWords(text) {
      const normalizedText = text.toLowerCase();
      return prohibitedWords.some((word) => normalizedText.includes(word));
    }

    function validateComment() {
      const commentText = textarea.value.trim();
      const hasForbiddenWords = containsProhibitedWords(commentText);

      textarea.classList.toggle('error', hasForbiddenWords);
      errorMessage.classList.toggle('show', hasForbiddenWords);

      return !hasForbiddenWords;
    }

    slider.addEventListener('input', (event) => {
      const value = Number(event.target.value);

      if (!hasInteractedWithSlider) {
        hasInteractedWithSlider = true;
        sendBtn.disabled = false;
      }

      updateBackground(value);
    });

    textarea.addEventListener('input', validateComment);

    sendBtn.addEventListener('click', (event) => {
      event.preventDefault();

      if (!hasInteractedWithSlider) {
        return;
      }

      const commentText = textarea.value.trim();

      if (containsProhibitedWords(commentText)) {
        validateComment();
        return;
      }

      formContainer.classList.add('hide');
      thankYou.classList.add('show');

      if (commentText) {
        commentOutput.innerHTML = '<div class="comment">"' + commentText + '"</div>';
      } else {
        commentOutput.innerHTML = '<div class="comment">Sin comentario adicional.</div>';
      }
    });

    updateBackground(slider.value);
  </script>
</body>
</html>
